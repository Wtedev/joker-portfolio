<head>
<meta data-own charset="utf-8">

<meta data-own name="theme-color" content="#000000">
<link data-own rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236D4AFF'/%3E%3C/svg%3E">

<style data-own>
:root{
  color-scheme:dark;
  --bg:#000000;
  --ink:#F4F2FA;
  --muted:#8E899E;
  --faint:#57536A;
  --line:rgba(255,255,255,.08);
  --glass:rgba(38,36,46,.55);
  --glass-2:rgba(255,255,255,.045);
  --violet:#6D4AFF;
  --indigo:#3A24A8;
  --lilac:#B9A6FF;
  --cyan:#86E3F6;
  --rose:#FF5C93;
  --peach:#F4C9B5;
  --ember:#FF4D6D;
  --sans:"Inter Tight","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Instrument Serif","Aref Ruqaa",Georgia,"Times New Roman",serif;
  --r-xl:36px;--r-lg:26px;--r-md:18px;
  --gutter:20px;
  box-sizing:border-box;
}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));background:var(--bg)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:12px}
.wrap{width:min(1180px,calc(100% - 2 * var(--gutter)));margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;inset-inline:0;z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) 0;pointer-events:none}
.nav-in{pointer-events:auto;margin-inline:auto;width:min(1180px,100%);display:flex;align-items:center;gap:8px;padding:11px 10px 12px 22px;border-radius:999px;background:rgba(18,17,24,.55);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
[dir=rtl] .nav-in{padding:11px 22px 12px 10px}
.nav-name{display:flex;align-items:baseline;font-weight:700;font-size:14.5px;margin-inline-end:auto;white-space:nowrap;letter-spacing:-.01em;line-height:1.55;color:#F4F2FA;overflow:visible}
.nav-brand{display:inline-block;padding-bottom:.18em;line-height:1.55;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(270deg,#FFFFFF 0%,#F7F2FF 50%,#E8DFFF 100%)}
[dir=ltr] .nav-brand{background-image:linear-gradient(90deg,#FFFFFF 0%,#F7F2FF 50%,#E8DFFF 100%)}
.nav-name .sep{color:var(--faint);font-weight:500;padding-inline:.35em}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{padding:8px 12px;color:var(--muted);font-size:15px;font-weight:500;transition:color .25s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.is-on{color:var(--lilac);font-weight:700}
.nav-cta{display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;background:var(--ink);color:#08070C;font-size:14px;font-weight:700;white-space:nowrap;transition:background .25s,color .25s,transform .4s cubic-bezier(.2,.8,.2,1)}
.nav-cta:hover{transform:translateY(-1px)}
.nav-cta.is-on{background:var(--violet);color:#fff}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .5s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .5s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-light{background:var(--ink);color:#08070C;box-shadow:0 10px 40px -10px rgba(185,166,255,.6)}
.btn-glass{background:var(--glass-2);border:1px solid var(--line);backdrop-filter:blur(14px)}
.btn-sm{padding:9px 16px;font-size:14px}
.ic{flex:none}
[dir=rtl] .ic-flip{transform:scaleX(-1)}
@media (max-width:760px){.nav-links{display:none}.nav-name{font-size:12.5px}.nav-cta{padding:8px 14px;font-size:13px}}

/* ---------- aurora ---------- */
/* السطوع يُضبط داخل كل تدرّج بدل opacity عامة، أوضح في التحكم ويقلّل طبقة مركّبة زائدة */
.aurora{position:absolute;pointer-events:none;filter:blur(24px);border-radius:50%}
/* الحركات اللانهائية تتوقف لما يخرج القسم من الشاشة */
.anim-off .chip,.anim-off .chip-spin,.anim-off .chip-name .name-card,.anim-off .phone-float,.anim-off .fc-in{animation-play-state:paused}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;align-items:center;padding:130px 0 60px;overflow:hidden}
.hero .a3{width:900px;height:580px;background:radial-gradient(circle,rgba(66,42,190,.62) 0%,rgba(58,36,168,.32) 34%,rgba(52,32,152,.11) 58%,rgba(52,32,152,0) 78%);top:-230px;inset-inline-start:-200px}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.hero-copy,.hero-stage{min-width:0}
@media (min-width:901px){
  .hero-grid{grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr)}
  .hero-stage{align-self:start;margin-top:-48px}
}
.hello{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.15)}
h1.headline{position:relative;font-size:clamp(44px,6.6vw,92px);line-height:1;font-weight:700;overflow:visible}
[dir=ltr] h1.headline{letter-spacing:-.045em}
[dir=rtl] h1.headline{line-height:1}
.line{display:block;overflow:hidden;line-height:1.45;padding-bottom:.2em;margin-bottom:-.32em}
.line:first-child{overflow:visible}
.line:first-child>span{position:relative;top:.62em}
.line:last-child{overflow:visible;margin-bottom:0;padding-bottom:.28em}
.line>span{display:inline-block;line-height:1.45;padding-bottom:.22em;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,#FFFFFF 0%,#F7F2FF 16%,#DDD0FF 42%,#C7B4FF 62%,#E7BBD4 84%,#FFCBD5 100%);background-size:11em 100%;background-repeat:no-repeat;background-position:0 0}
[dir=rtl] .line>span{background-image:linear-gradient(270deg,#FFFFFF 0%,#F7F2FF 16%,#DDD0FF 42%,#C7B4FF 62%,#E7BBD4 84%,#FFCBD5 100%);background-position:100% 0}
.tools{position:relative;height:118px;width:100%;max-width:46ch;margin-top:14px;overflow:hidden;contain:inline-size;direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tools-track{position:absolute;top:42px;left:0;display:flex;height:44px;width:max-content;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
.tools-set{display:flex;align-items:center;gap:10px;flex:none;padding-inline-end:10px}
.tool{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;z-index:0}
.tool-face{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:transform .22s cubic-bezier(.22,1,.32,1)}
.tool-face.on{background:var(--tc);border-color:transparent}
.tool-face img,.tool-face svg{width:22px;height:22px;display:block}
.tool-face.on img,.tool-face.mono img{filter:brightness(0) invert(1)}
.tool-face.on.ink img{filter:none}
.tool-face.adobe-app{background:var(--abg);border-color:transparent;color:var(--tc);font-family:"Inter Tight",var(--sans);font-weight:800;font-size:20px;letter-spacing:-.06em;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tool-face.brand svg{width:auto;height:22px}
.tool-face.brand svg.hf{width:28px;height:28px}
.tool-cat,.tool-name{position:absolute;left:50%;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .28s ease,transform .28s ease}
.tool-cat{bottom:calc(100% + 12px);transform:translateX(-50%) translateY(6px);direction:rtl;font-size:12.5px;font-weight:700;line-height:1.2;color:#fff;background:var(--violet);padding:7px 12px;border-radius:10px;box-shadow:0 10px 22px -12px rgba(109,74,255,.95)}
.tool-cat::after{content:"";position:absolute;left:50%;top:100%;width:0;height:0;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--violet)}
.tool-name{top:calc(100% + 8px);transform:translateX(-50%) translateY(-6px);font-size:11px;font-weight:600;color:var(--muted)}
.tool:hover{z-index:2}
.tool:hover .tool-face{transform:scale3d(1.16,1.16,1)}
.tool:hover .tool-cat,.tool:hover .tool-name{opacity:1;transform:translateX(-50%) translateY(0)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}

.hero-stage{position:relative;height:min(680px,78vh);display:grid;place-items:center;perspective:1100px}
.memoji-scene{position:relative;width:100%;height:100%;display:grid;place-items:center;z-index:2;perspective:1100px}
.ring{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(185,166,255,.14);transform:rotateX(72deg);bottom:4%}
.memoji-wrap{position:relative;width:min(580px,96%);aspect-ratio:1;z-index:2;transform:translateZ(0);transform-style:preserve-3d}
.memoji-tilt{position:absolute;inset:0;transform:translateZ(0);transform-style:preserve-3d;will-change:transform}
.memoji-main{position:absolute;inset:0}
.memoji-main img,.memoji-main video{width:100%;height:100%;object-fit:contain}
.memoji-shadow{position:absolute;left:50%;bottom:-6%;width:52%;height:34px;margin-left:-26%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.9),transparent);filter:blur(6px);will-change:transform,opacity}
.orb{position:absolute;inset:12%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 26%,#FFFFFF 0%,#F0EAFF 7%,#CDBCFF 20%,#9A79FF 38%,#6D4AFF 55%,#3E22B8 74%,#20144F 91%,#170E3A 100%);box-shadow:inset -22px -32px 70px rgba(10,4,40,.55),inset 12px 16px 34px rgba(255,255,255,.22),0 0 70px -10px rgba(109,74,255,.45)}
.orb span{font-size:clamp(64px,9vw,120px);font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 10px 30px rgba(0,0,0,.4)}
.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:500;background:rgba(22,20,32,.38);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px -22px rgba(0,0,0,.65);white-space:nowrap}
.chip-a{top:auto;bottom:42%;inset-inline-start:4%;z-index:8;transform-origin:center;transform-style:preserve-3d}
.chip-b{bottom:24%;inset-inline-end:0;z-index:4;transform-origin:center;transform-style:preserve-3d}
.chip-spin{display:flex;align-items:center;gap:inherit;transform-origin:center;transform-style:preserve-3d;animation:axis-turn 10s ease-in-out infinite}
.chip-b .chip-spin{animation:axis-turn 11s ease-in-out -3s infinite}
.chip-name{z-index:1;top:9%;bottom:auto;left:auto;right:auto;inset-inline-start:-13%;inset-inline-end:auto;margin:0;display:block;width:max-content;padding:0;gap:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;white-space:normal;transform-origin:center;transform-style:preserve-3d}
.chip-name .name-card{display:flex;flex-direction:column;gap:0;min-width:268px;padding:16px 18px 18px;border-radius:28px;overflow:hidden;background:rgba(26,22,40,.48);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 64px -22px rgba(109,74,255,.7);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);transform-origin:20% 90%;animation:axis-card 12s ease-in-out -5s infinite}
.chip-name .name-head{display:flex;align-items:center;gap:8px;padding:0 2px 12px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:600}
.chip-name .name-tag{flex:none;padding:4px 9px;border-radius:999px;background:rgba(109,74,255,.38);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em}
.chip-name .name-alias{color:var(--lilac);font-weight:700}
.chip-name .name-live{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-size:12px;font-weight:700}
.chip-name .name-live i{width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px rgba(255,92,147,.22)}
.chip-name .name-body{display:flex;align-items:center;gap:14px}
.chip-name .name-mark{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(140deg,#8A66FF,#B77BFF 48%,var(--rose));font-size:22px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.chip-name .grow{display:grid;gap:3px;min-width:0;text-align:start}
.chip-name small{font-size:13px;color:var(--muted);font-weight:500}
.chip-name b{font-size:clamp(19px,1.9vw,28px);font-weight:800;line-height:1.2;letter-spacing:-.01em}
@keyframes axis-turn{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-12deg)}}
@keyframes axis-turn-rev{0%,100%{transform:rotateY(0)}50%{transform:rotateY(12deg)}}
@keyframes axis-card{0%,100%{transform:rotate(3deg) rotateY(0)}50%{transform:rotate(3deg) rotateY(-12deg)}}
@media (max-width:900px){
  .hero{min-height:100svh;padding:calc(84px + env(safe-area-inset-top,0px)) 0 calc(22px + env(safe-area-inset-bottom,0px));align-items:start}
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:10px}
  .hero-stage{height:auto;order:-1;display:flex;flex-direction:column;align-items:center;gap:0;padding-inline:0}
  .memoji-scene{height:clamp(230px,37svh,320px);width:100%;place-items:end center}
  .memoji-wrap{width:min(318px,90%,37svh)}
  .chip-a,.chip-b{padding:6px 10px;font-size:11.5px;gap:6px}
  .chip-a svg,.chip-b svg{width:14px;height:14px}
  .chip-a{top:14%;bottom:auto;inset-inline-start:auto;inset-inline-end:0}
  .chip-b{bottom:auto;top:46%;inset-inline-end:auto;inset-inline-start:0}
  .chip-name{position:relative;top:auto;bottom:auto;left:auto;right:auto;inset:auto;width:max-content;max-width:100%;margin:-32px auto 14px;z-index:6}
  .chip-name .name-card{min-width:0;width:auto;flex-direction:row;align-items:center;gap:0;padding:10px 18px 10px 10px;border-radius:999px;transform:none;animation:axis-turn 12s ease-in-out -5s infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 36px -18px rgba(109,74,255,.75)}
  .chip-name .name-head{display:none}
  .chip-name .name-tag,.chip-name .name-alias,.chip-name small,.chip-name .name-live{display:none}
  .chip-name .name-body{gap:12px}
  .chip-name .name-mark{width:40px;height:40px;border-radius:50%;font-size:16px}
  .chip-name b{font-size:15px;font-weight:700;line-height:1.2}
  .hero-copy{padding-inline:0}
  h1.headline{font-size:clamp(34px,9vw,44px);margin:0}
  .line:first-child>span{top:.1em}
  .line{margin-bottom:-.38em;padding-bottom:.1em}
  .line:last-child{padding-bottom:.16em;margin-bottom:0}
  #h-intro{margin:14px 0 0;font-size:14.5px;line-height:1.65;color:#C9C4D8}
  .tools{height:56px;margin-top:20px;max-width:none}
  .tools-track{top:6px}
  .hero-actions{margin-top:22px;justify-content:flex-start;gap:10px}
  .hero-actions .btn{padding:12px 20px}
}

/* ---------- section basics ---------- */
section{position:relative}
.sec{padding:clamp(90px,12vw,150px) 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:48px}
h2{font-size:clamp(34px,4.6vw,60px);line-height:1.08;font-weight:700}
[dir=ltr] h2{letter-spacing:-.035em}
[dir=rtl] h2{line-height:1.25}
.lead{color:var(--muted);max-width:52ch}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:56px;align-items:start}
.about-copy{max-width:36.5rem}
.bio{font-size:clamp(16.5px,1.45vw,19.5px);line-height:1.85;font-weight:400;color:#C9C4D8;max-width:none}
.bio p{margin:0 0 1.15em}
.bio p:last-child{margin-bottom:0}
.bio .lede{font-size:clamp(19px,1.9vw,26px);line-height:1.7;font-weight:550;color:#F2EFF8;margin-bottom:1.15em}
.bio .lede .mk{all:unset;font-weight:inherit;color:inherit}
.keep{white-space:nowrap}
.mk{font-family:inherit;font-style:normal;font-weight:700;padding:.05em .28em .08em;border-radius:.42em;white-space:nowrap}
.mk-pill{color:#fff;background:linear-gradient(135deg,#7A54FF,#C07BFF);border-radius:999px;padding:.08em .5em .12em;box-shadow:0 10px 28px -12px rgba(109,74,255,.9)}
.mk-wave{color:#FFD0C4;background:none;padding:0 0 .16em;border-radius:0;background-image:radial-gradient(circle at 4px 3px,#FF8FB3 1.7px,transparent 2px);background-size:8px 6px;background-repeat:repeat-x;background-position:0 100%}
.mk-outline{color:#E8DFFF;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(185,166,255,.75)}
.mk-hi{color:#E4FBFF;background:linear-gradient(transparent 52%,rgba(134,227,246,.38) 52%)}
.mk-wobble{color:#FFD4CC;background:rgba(255,92,147,.14);box-shadow:inset 0 -2px 0 #FF6B8A;display:inline-block;transform:rotate(-1.6deg)}
.mk-hot{color:#fff;background:linear-gradient(180deg,#FF4D6D,#FF86A8);border-radius:.55em;text-shadow:0 1px 0 rgba(80,0,20,.25);display:inline-block;transform:translateY(8px)}
.mk-grad{padding:0;font-weight:800;font-size:1.08em;background:linear-gradient(92deg,#FFFFFF 8%,#D8CAFF 48%,#FFC2D6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mk-tag{color:#7DFFD2;background:#123D38;border-radius:7px;font-size:.92em}
.mk-pixel{color:#86E3F6;border-radius:0;letter-spacing:.07em;background:repeating-linear-gradient(90deg,rgba(134,227,246,.2) 0 3px,transparent 3px 6px);box-shadow:2px 2px 0 rgba(134,227,246,.4)}
.mk-ggl{color:#fff;background:none;padding:0 .08em .16em;border-radius:0;background-image:linear-gradient(90deg,#86E3F6,#B9A6FF 40%,#FF8FB3 70%,#F4C9B5);background-size:100% 3px;background-repeat:no-repeat;background-position:0 100%}
.mk-search{color:#B9F4FF;background:rgba(134,227,246,.1);border-radius:999px;box-shadow:inset 0 0 0 1px rgba(134,227,246,.38)}
.mk-kpi{color:#08070C;background:#E9E6F2;border-radius:8px;font-size:.88em;letter-spacing:.03em;padding:.1em .4em}
.mk-zag{color:#FFD6C2;background:none;white-space:normal;padding:0 0 .2em;border-radius:0;background-image:repeating-linear-gradient(-55deg,transparent 0 4px,#FF6B8A 4px 6px);background-size:100% 4px;background-repeat:no-repeat;background-position:0 100%}
.mk-mad{color:#FFD4CC;background:rgba(255,75,43,.16);box-shadow:0 0 0 1px rgba(255,75,43,.38);display:inline-block;transform:rotate(1.7deg)}
.mk-quote{color:#F4C9B5;background:rgba(244,201,181,.08);border-radius:0;padding:0 .4em;box-shadow:inset 3px 0 0 var(--peach);font-weight:600}
.mk-stamp{color:#CDBCFF;background:transparent;box-shadow:inset 0 0 0 2px rgba(185,166,255,.55);border-radius:5px;display:inline-block;transform:rotate(-2deg);padding:.1em .38em;font-weight:800}
.mk-code{color:#C9BBFF;background:#16141F;box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;font-size:.92em;font-weight:600}
.mk-term{color:#86E3F6;background:#0E1A1C;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(134,227,246,.28)}
.mk-tap{color:#08070C;background:var(--ink);border-radius:999px;padding:.08em .55em .12em;box-shadow:0 8px 26px -12px rgba(185,166,255,.75)}
.facts{list-style:none;margin:0;display:grid;gap:10px;max-width:none}

.about-wa{display:flex;width:max-content;margin-top:22px}
.more-slot{display:block;width:max-content;max-width:100%;margin-top:16px;min-height:36px}
.more-btn{display:block;width:max-content;max-width:100%;padding:0;border:0;background:none;color:#fff;font-weight:700;font-size:13px;line-height:1.3;text-align:start;cursor:pointer}
.more-in{position:relative;display:flex;align-items:center;gap:7px;padding:7px 12px 8px;background:var(--violet);border-radius:4px 16px 16px 16px;box-shadow:0 10px 28px -12px rgba(88,50,230,.9);transform-origin:50% 80%;animation:lure 3.8s ease-in-out infinite;will-change:transform}
[dir=rtl] .more-in{border-radius:16px 4px 16px 16px}
.more-in::before{content:"";position:absolute;inset:-8px;border-radius:12px 22px 22px 22px;box-shadow:0 0 0 1.5px rgba(185,166,255,.5);animation:lure-ring 3.8s ease-out infinite;pointer-events:none}
[dir=rtl] .more-in::before{border-radius:22px 12px 22px 22px}
.more-in::after{content:"";position:absolute;width:9px;height:9px;background:var(--violet);inset-inline-start:12px;bottom:-4px;border-radius:2px;transform:rotate(45deg)}
.more-btn .q{flex:none;width:17px;height:17px;display:grid;place-items:center;border-radius:5px;background:#fff;color:var(--violet);font-size:11px;font-weight:800;animation:lure-q 3.8s ease-in-out infinite}
.more-btn .more-txt{border:0}
.more-btn:hover .more-in{background:#7A54FF;animation-duration:2.6s}
.more-btn[aria-expanded=true]{color:var(--lilac);font-weight:600;font-size:13px}
.more-btn[aria-expanded=true] .more-in{background:transparent;box-shadow:none;padding-inline:2px;transform:none;animation:none}
.more-btn[aria-expanded=true] .more-in::before,.more-btn[aria-expanded=true] .more-in::after{display:none}
.more-btn[aria-expanded=true] .q{background:rgba(185,166,255,.18);color:var(--lilac);border-radius:50%;animation:none}
.more-btn.stuck{position:fixed;z-index:36;margin:0}
.more-btn.stuck .more-in{animation-duration:3.2s}
@keyframes lure{0%,100%{transform:rotate(-2deg) translateY(0) scale(1)}50%{transform:rotate(-1.2deg) translateY(-6px) scale(1.04)}}
@keyframes lure-ring{0%{opacity:.5;transform:scale(.94)}65%,100%{opacity:0;transform:scale(1.18)}}
@keyframes lure-q{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.bio-more{margin-top:18px}
.bio-more.typing p:last-child::after{content:"";display:inline-block;width:1.5px;height:.85em;margin:0 3px -.12em;background:var(--lilac);border-radius:1px;vertical-align:middle;animation:caret 1.05s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.mk.mk-pop{display:inline-block;vertical-align:baseline}
.mk-hot.mk-pop{overflow:visible;animation:mkBoom 1.15s cubic-bezier(.18,.8,.22,1) both}
.mk-tag.mk-pop{animation:mkBubble .95s cubic-bezier(.18,1.45,.32,1) both}
.mk-mad.mk-pop{animation:mkRage 1.45s ease-out both}
.mk-stamp.mk-pop{animation:mkFall 1.15s cubic-bezier(.2,.55,.2,1.2) both}
.mk-grad.mk-pop{animation:mkPop .85s cubic-bezier(.18,1.35,.32,1) both}
.mk-term.mk-pop{animation:none}
.mk-term.mk-coding::after{content:"▌";margin-inline-start:2px;color:#86E3F6;animation:caret .55s steps(1) infinite}
@keyframes mkBoom{
  0%{clip-path:inset(0 0 0 100%);transform:translateY(8px) scale(1);box-shadow:none;filter:none}
  38%{clip-path:inset(0);transform:translateY(8px) scale(1)}
  52%{clip-path:inset(0);transform:translateY(8px) scale(1.55) rotate(-4deg);filter:brightness(1.45);box-shadow:0 0 0 0 #FF4D6D,8px -12px 0 0 #FF86A8,-12px 6px 0 0 #FF4D6D,14px 10px 0 0 #fff,-10px -8px 0 0 #FFB3C7,0 0 24px 8px rgba(255,77,109,.55)}
  68%{transform:translateY(8px) scale(.88) rotate(3deg);filter:brightness(1.1);box-shadow:18px -22px 0 0 transparent,-22px 14px 0 0 transparent,24px 18px 0 0 transparent,-18px -16px 0 0 transparent,0 0 0 16px rgba(255,77,109,0)}
  100%{clip-path:inset(0);transform:translateY(8px);filter:none;box-shadow:none}
}
@keyframes mkBubble{0%{opacity:0;transform:scale(0) translateY(16px);border-radius:50%}42%{opacity:1;transform:scale(1.28) translateY(-10px);border-radius:50%}68%{transform:scale(.9) translateY(3px);border-radius:14px}100%{transform:none;border-radius:7px}}
@keyframes mkRage{0%{opacity:0;transform:scale(.15)}42%{opacity:1;transform:scale(1.4)}55%{transform:scale(1)}62%{transform:translateX(-8px) rotate(-5deg)}70%{transform:translateX(8px) rotate(5deg)}78%{transform:translateX(-6px) rotate(-3deg)}86%{transform:translateX(5px) rotate(3deg)}94%{transform:translateX(-2px)}100%{transform:rotate(1.7deg)}}
@keyframes mkFall{0%{opacity:0;transform:translateY(-56px) rotate(-22deg)}72%{opacity:1;transform:translateY(8px) rotate(5deg)}86%{transform:translateY(-5px) rotate(-4deg)}100%{transform:rotate(-2deg)}}
@keyframes mkPop{
  0%{opacity:0;transform:scale(.35) translateY(10px) rotate(-12deg);filter:blur(8px)}
  58%{opacity:1;transform:scale(1.22) translateY(-3px) rotate(2deg);filter:blur(0);box-shadow:0 10px 28px -10px rgba(185,166,255,.7)}
  100%{opacity:1;transform:none;filter:none}
}

/* ---------- placeholders ---------- */
/* ثلاث مشاكل كانت هنا: hsl بتشبع ثابت يعطي أخضر صارخ وبنفسجي باهت بنفس الأرقام،
   والتدرّج يتلاشى إلى transparent (أسود شفاف) فيتسخ، والألوان موزّعة على 360 درجة
   فتطلع غريبة عن هوية الصفحة.
   الحل: oklch يوحّد السطوع المُدرك، والتلاشي بنفس اللون، و--hb يحصر الدرجة في قوس
   الهوية (بنفسجي ← أرجواني ← وردي ← دافئ) مع الحفاظ على تنويع مأخوذ من بيانات المستخدم. */
.ph{
  --hb:calc(250 + (var(--h,260) / 360) * 150);
  width:100%;height:100%;display:grid;place-items:center;
  /* بديل للمتصفحات القديمة: لو oklch غير مدعوم يسقط الإعلان التالي ويبقى هذا */
  background:linear-gradient(150deg,#3B2A7A,#1B1238 55%,#0C0916);
  background:
    radial-gradient(125% 95% at 18% 8%,oklch(.7 .15 var(--hb)) 0%,oklch(.7 .15 var(--hb) / .52) 30%,oklch(.7 .15 var(--hb) / .14) 52%,oklch(.7 .15 var(--hb) / 0) 70%),
    radial-gradient(95% 85% at 92% 100%,oklch(.5 .155 calc(var(--hb) + 34)) 0%,oklch(.5 .155 calc(var(--hb) + 34) / .5) 32%,oklch(.5 .155 calc(var(--hb) + 34) / .12) 56%,oklch(.5 .155 calc(var(--hb) + 34) / 0) 74%),
    linear-gradient(160deg,#151127,#0A0812);
}
.ph span{font-weight:700;font-size:clamp(18px,2.4vw,28px);color:rgba(255,255,255,.9);padding:20px;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.45)}

/* ---------- work ---------- */
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:22px;background:var(--glass-2);border:1px solid var(--line);max-width:100%;justify-content:flex-end}
.tabs button{padding:10px 16px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;line-height:1.35;text-align:center;transition:background .4s,color .4s}
.tabs button.tab-main{color:var(--ink);font-weight:650}
.tabs button[aria-selected=true]{background:var(--ink);color:#08070C}

  .tabs{width:100%;flex-direction:column;align-items:stretch;border-radius:18px}
  .tabs button{width:100%;font-size:13.5px;padding:11px 14px;border-radius:14px}
}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.pcard{position:relative;display:block;text-align:start;border-radius:var(--r-xl);padding:12px;background:var(--glass-2);border:1px solid var(--line);transition:border-color .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
/* زر شفاف يغطي البطاقة كاملة عشان أي ضغطة تفتح المشروع */
.hit{position:absolute;inset:0;z-index:3;border-radius:inherit;cursor:pointer}
.pcard:hover{border-color:rgba(185,166,255,.3);transform:translateY(-4px)}
.pcard:first-child{grid-column:1/-1}
.pmedia{position:relative;aspect-ratio:16/10;border-radius:28px;overflow:hidden}
.pcard:first-child .pmedia{aspect-ratio:21/9}
.pmedia img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.pmedia::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(to top,rgba(8,7,12,.62),transparent);pointer-events:none;opacity:.9;transition:opacity .45s}
.pcard:hover .pmedia img{transform:scale(1.04)}
.pcard:hover .pmedia::after{opacity:1}
.pinfo{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:16px 10px 12px}
.pinfo h3{font-size:22px;font-weight:600;line-height:1.3}
.mpills{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--muted);font-size:14.5px;line-height:1.5}
.mpills span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45;margin:0 10px;vertical-align:middle}
.pgo{position:absolute;z-index:4;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;padding-inline:4px 14px;border-radius:16px;background:rgba(14,12,20,.78);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#F4F2FA;font-size:13px;font-weight:650;letter-spacing:.01em;white-space:nowrap;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.pgo-ic{width:28px;height:28px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none;transition:background .3s,color .3s}
.pgo:hover,.pgo:focus-visible{background:#F4F2FA;color:#08070C;border-color:#F4F2FA;transform:scale(1.05);box-shadow:0 10px 28px rgba(0,0,0,.28)}
.pgo:hover .pgo-ic,.pgo:focus-visible .pgo-ic{background:rgba(8,7,12,.1)}
.pgo .ic{flex-shrink:0}
.tag{font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:#CFCAE0;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;margin-top:10px;max-width:100%}

.shots{columns:3 280px;column-gap:18px}

.shot:hover figcaption,.shot:has(.hit:focus-visible) figcaption{opacity:1;transform:none}

.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-lg)}

.stk-kicker{display:inline-flex;align-items:center;gap:8px;color:var(--lilac);font-size:13px;font-weight:700;letter-spacing:.04em}
.stk-kicker i{width:7px;height:7px;border-radius:50%;background:var(--lilac);box-shadow:0 0 0 4px rgba(185,166,255,.16)}
.stk-head h2{position:relative;font-size:clamp(40px,6.2vw,76px);font-weight:800;line-height:1.12;letter-spacing:-.03em;padding-bottom:.28em;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(270deg,#FFFFFF 0%,#F4F0FF 28%,#D8CAFF 58%,#FFC2D6 100%);filter:drop-shadow(0 10px 28px rgba(109,74,255,.28));transform:rotate(-1.1deg);transform-origin:right center}
[dir=ltr] .stk-head h2{background-image:linear-gradient(90deg,#FFFFFF 0%,#F4F0FF 28%,#D8CAFF 58%,#FFC2D6 100%);transform-origin:left center}
.stk-head h2::after{content:"";position:absolute;inset-inline-start:0;bottom:.08em;width:4.6em;height:9px;border-radius:99px;background:linear-gradient(90deg,var(--lilac),#C07BFF 55%,var(--rose));transform:rotate(-2.4deg);box-shadow:0 8px 22px -8px rgba(109,74,255,.8);opacity:.95}
.stk-space{position:relative;border-radius:28px;border:1px solid var(--line);background:rgba(18,16,28,.72);overflow:hidden;min-height:min(760px,78vh);height:min(760px,78vh);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 80px -40px rgba(109,74,255,.4)}
.stk-chrome{position:absolute;inset:14px 14px auto;z-index:6;display:flex;align-items:center;gap:10px;pointer-events:none}
.stk-chrome b{font-size:13px;font-weight:750;letter-spacing:.02em}
.stk-chrome small{margin-inline-start:auto;color:var(--muted);font-size:12px;font-weight:550}
.stk-dots{display:flex;gap:6px}
.stk-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.stk-dots i:first-child{background:#FF6B8A}
.stk-dots i:nth-child(2){background:#F4C9B5}
.stk-dots i:nth-child(3){background:#7DFFD2}
.stk-grid{position:absolute;inset:0;direction:ltr;touch-action:none;cursor:default;
  background-color:#0C0A14;
  background-image:
    linear-gradient(rgba(185,166,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(185,166,255,.07) 1px,transparent 1px),
    radial-gradient(120% 80% at 80% -10%,rgba(109,74,255,.18),transparent 55%),
    radial-gradient(90% 70% at -10% 110%,rgba(255,92,147,.1),transparent 50%);
  background-size:48px 48px,48px 48px,auto,auto;
}
.stk-bit{position:absolute;left:0;top:0;width:var(--s,96px);z-index:1;padding:0;border:0;background:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.stk-face{display:block;transform:rotate(var(--r,0deg));transform-origin:center;filter:drop-shadow(3px 10px 0 rgba(0,0,0,.22)) drop-shadow(0 16px 18px rgba(0,0,0,.4));animation:stk-breathe 9s ease-in-out infinite;will-change:transform}
.stk-bit img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.stk-bit.hold{z-index:24;cursor:grabbing}
.stk-bit.hold .stk-face{animation:none;transform:rotate(var(--r,0deg)) scale(1.08);filter:drop-shadow(8px 22px 0 rgba(0,0,0,.16)) drop-shadow(0 28px 28px rgba(109,74,255,.32))}
.anim-off .stk-face{animation-play-state:paused}
@keyframes stk-breathe{0%,100%{transform:rotate(var(--r,0deg)) scale(1)}50%{transform:rotate(var(--r,0deg)) scale(1.045)}}
@media (max-width:900px){
  .stk-space{border-radius:20px;min-height:min(620px,74vh);height:min(620px,74vh)}
  .stk-grid{background-size:36px 36px,36px 36px,auto,auto}
  .stk-chrome{inset:10px 10px auto}
  .stk-chrome small{display:none}
}
.lb.stk-lb .modal-card img{max-height:78vh;max-width:min(92vw,720px);width:auto;height:auto;border-radius:0;background:none;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}

/* ---------- services bento ---------- */
.bento{display:grid;grid-template-columns:1.15fr 1fr 1fr;grid-auto-rows:minmax(230px,auto);gap:16px}
.svc{position:relative;overflow:hidden;padding:26px;border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.svc h3{font-size:19px;font-weight:600}
.svc p{color:var(--muted);font-size:15px;line-height:1.7}
.svc-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--lilac)}
.svc.big{grid-row:span 2;justify-content:center;text-align:center;align-items:center;padding:40px 30px}
.svc.big::before{content:"";position:absolute;inset:auto -20% -34% -20%;height:74%;background:radial-gradient(closest-side,rgba(150,232,248,.62) 0%,rgba(150,140,255,.55) 34%,rgba(115,82,255,.3) 58%,rgba(109,74,255,.1) 78%,rgba(109,74,255,0) 100%);filter:blur(30px)}
.svc.big>*{position:relative}
.svc.big .svc-ic{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,var(--indigo),#1A1330);box-shadow:0 0 40px rgba(109,74,255,.5)}
.svc.big h3{font-size:26px}
.svc .deco{position:absolute;inset-inline-end:-10px;bottom:-14px;color:rgba(185,166,255,.08)}
@media (max-width:900px){.bento{grid-template-columns:1fr 1fr}.svc.big{grid-column:1/-1;grid-row:auto}}
@media (max-width:560px){.bento{grid-template-columns:1fr}}

/* ---------- finale / CTA ---------- */
.finale{padding:clamp(110px,14vw,190px) 0 60px;overflow:hidden;text-align:center}
.finale .a5{width:920px;height:600px;bottom:-190px;left:50%;margin-left:-460px;background:radial-gradient(circle,rgba(130,94,255,.8) 0%,rgba(116,80,255,.45) 26%,rgba(109,74,255,.18) 50%,rgba(109,74,255,.06) 66%,rgba(109,74,255,0) 80%)}
.finale .a6{width:560px;height:440px;bottom:-170px;inset-inline-start:2%;background:radial-gradient(circle,rgba(255,140,190,.36) 0%,rgba(255,130,182,.18) 32%,rgba(255,125,178,.05) 56%,rgba(255,125,178,0) 76%)}
.cta-type{position:relative;display:grid;justify-items:center}
.cta-bold{position:relative;z-index:2;font-size:clamp(52px,10vw,150px);font-weight:700;line-height:1;color:#E9E6F2}
[dir=ltr] .cta-bold{letter-spacing:-.055em}
[dir=rtl] .cta-bold{line-height:1.2}
.cta-script{position:relative;z-index:1;width:min(900px,96%);height:auto;margin-top:-4.2vw;overflow:visible}
.cta-script text{font-family:var(--script);font-style:italic;font-size:200px;fill:#6E6A7C;fill-opacity:0;stroke:#9B96AC;stroke-width:1.4;stroke-dasharray:5000;stroke-dashoffset:5000}
[dir=rtl] .cta-script text{font-style:normal}
.finale.write .cta-script text{animation:draw 3.2s cubic-bezier(.45,.05,.3,1) forwards,fillin 1.2s ease 2.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-opacity:.2}}
.cta-bold .cb{display:inline-block;clip-path:inset(0 0 100% 0);transform:translateY(20%);transition:clip-path 1.2s cubic-bezier(.2,.8,.2,1),transform 1.2s cubic-bezier(.2,.8,.2,1)}
.finale.write .cta-bold .cb{clip-path:inset(0 0 -10% 0);transform:none}
.cta-line{color:var(--muted);margin:40px auto 0;max-width:46ch;font-size:18px}
.cta-line a{color:var(--lilac)}
.finale .btn-light{margin-top:30px;padding:17px 30px;font-size:17px}
.contacts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:56px}
.contacts a{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:15px;transition:background .3s,border-color .3s}
.contacts a[href^="mailto"]{direction:ltr;unicode-bidi:isolate}
.contacts a:hover{background:rgba(255,255,255,.09);border-color:rgba(185,166,255,.3)}
.contacts .ic{color:var(--lilac)}
footer{padding:40px 0 calc(30px + env(safe-area-inset-bottom,0px));color:var(--faint);font-size:14px;text-align:center}

/* ---------- modal / lightbox ---------- */
/* visibility:hidden يمنع المتصفح من الاحتفاظ بطبقة backdrop-filter بحجم الشاشة وهي مخفية */
/* visibility بدون انتقال عند الفتح (وإلا يفضل مخفياً أول إطار فما يقبل التركيز)، وبتأخير عند الإغلاق حتى يكتمل التلاشي */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:12px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s,visibility 0s .4s}
.modal.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s,visibility 0s}
.modal-card{width:min(980px,100%);max-height:88vh;overflow:auto;border-radius:var(--r-xl);background:rgba(18,17,24,.92);border:1px solid var(--line);padding:8px;transform:translateY(30px) scale(.98);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.modal.open .modal-card{transform:none}
.modal-card .pmedia{aspect-ratio:16/9}
.m-body{padding:14px 8px 8px}
.m-body h3{font-size:clamp(26px,3vw,38px);line-height:1.2;font-weight:700}
.m-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0 18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03)}
.m-fact{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-inline-start:1px solid var(--line);min-width:0}
.m-fact:first-child{border-inline-start:0}
.m-fact .ic{color:var(--lilac);flex:none;margin-top:2px}
.m-fact>div{display:grid;gap:4px;min-width:0}
.m-fact small{font-size:11px;color:var(--muted);font-weight:550}
.m-fact b{font-size:15px;font-weight:650;line-height:1.4;color:var(--ink)}
.m-body p{color:#CFCAE0;max-width:68ch;white-space:pre-line}
.gallery{display:grid;gap:14px;margin-top:14px}
.gallery img{border-radius:22px;width:100%}
.g-item{display:grid;gap:6px}
.g-item img{border-radius:22px;width:100%;border:1px solid var(--line)}
.g-cap{display:flex;align-items:baseline;gap:10px;padding:0 2px;order:-1}
.g-num{font-size:12px;letter-spacing:.14em;color:var(--lilac);font-weight:650;min-width:2.2em}
.g-lab{display:grid;gap:1px}
.g-lab b{font-size:15px;font-weight:650;color:var(--ink)}
.g-lab span{font-size:12.5px;color:var(--muted)}
.m-kicker{font-size:12px;letter-spacing:.16em;color:var(--lilac);margin-bottom:4px;font-weight:650}
.x-btn{position:sticky;top:0;float:inline-end;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(40,38,48,.85);border:1px solid var(--line);display:grid;place-items:center}
.lb img{max-height:84vh;border-radius:24px;width:auto;margin:auto}
.lb .modal-card{background:none;border:0;padding:0;width:auto;overflow:visible}

/* ---------- dashboard ---------- */
.dash{position:fixed;inset:0;z-index:100;background:rgba(4,4,7,.82);backdrop-filter:blur(18px);display:none;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.dash.open{display:flex}
.dash-shell{flex:1;display:grid;grid-template-rows:auto 1fr;border-radius:28px;border:1px solid var(--line);background:#0E0D14;overflow:hidden;max-width:1200px;margin-inline:auto;width:100%}
.dash-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dash-top h2{font-size:20px;margin-inline-end:auto}
.status-txt{font-size:14px;color:var(--muted)}
.status-txt.dirty{color:var(--peach)}
.dash-main{display:grid;grid-template-columns:210px 1fr;min-height:0}
.dash-nav{border-inline-end:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.dash-nav button{text-align:start;padding:11px 14px;border-radius:14px;color:var(--muted);font-size:15px}
.dash-nav button[aria-selected=true]{background:rgba(185,166,255,.12);color:var(--ink)}
.dash-body{overflow:auto;padding:24px;min-height:0}
.dash-body h3{font-size:19px;margin-bottom:6px}
.hint{color:var(--muted);font-size:14px;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.f input,.f textarea,.f select{font:inherit;font-size:15px;color:var(--ink);background:#17151F;border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.f textarea{resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--lilac)}
.f-check{display:flex;align-items:center;gap:10px;color:var(--ink)}
.f-check input{width:18px;height:18px;accent-color:var(--violet)}
.item{border:1px solid var(--line);border-radius:20px;background:#12111A;margin-bottom:12px}
.item>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item>summary .grow{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .inner{padding:4px 16px 18px}
.mini-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.mini-btn:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.mini-btn.danger:hover{color:#FF7A66;border-color:rgba(255,122,102,.4)}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.imgbox{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.imgbox img,.imgbox video,.imgbox .ph{width:100%;height:100%;object-fit:cover}
.imgbox button{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.upl{width:96px;height:96px;border-radius:14px;border:1px dashed rgba(185,166,255,.35);color:var(--lilac);display:grid;place-items:center;font-size:13px;text-align:center;padding:6px}
.add-btn{width:100%;padding:14px;border-radius:16px;border:1px dashed rgba(185,166,255,.35);color:var(--lilac);font-weight:500}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:18px;padding:10px;background:#12111A;display:grid;gap:8px}
.wcard .imgbox{width:100%;height:150px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);z-index:120;padding:12px 20px;border-radius:99px;background:#1D1B26;border:1px solid var(--line);font-size:15px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.gate{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:20px;background:rgba(4,4,7,.82);backdrop-filter:blur(18px)}
.gate.open{display:grid}
.gate-card{width:min(360px,100%);padding:28px 24px 24px;border-radius:28px;background:#0E0D14;border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 70px -30px rgba(0,0,0,.8);text-align:center}
.gate-card p{font-size:15px;color:var(--muted);margin-bottom:16px}
.gate-card input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#17151F;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:center;letter-spacing:.12em}
.gate-card input:focus{outline:none;border-color:var(--lilac)}
.gate-card button{width:100%;margin-top:12px;padding:12px;border-radius:14px;background:var(--ink);color:#08070C;font-weight:700}
.gate-card.bad{animation:gate-shake .42s ease}
@keyframes gate-shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (max-width:760px){
  .dash-main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .dash-nav{flex-direction:row;border-inline-end:0;border-bottom:1px solid var(--line);padding:10px}
  .dash-nav button{white-space:nowrap}
  .fgrid{grid-template-columns:1fr}
  .dash-body{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cta-script text{fill-opacity:1;stroke-dashoffset:0}
  .cta-bold .cb{clip-path:none;transform:none}
  .tools{height:auto;-webkit-mask-image:none;mask-image:none;overflow:visible}
  .tools-track{position:relative;top:auto;left:auto;flex-wrap:wrap;width:auto;height:auto;animation:none}
  .tools-set{flex-wrap:wrap;padding-inline-end:0}
}
</style>
</head>
<body>

<header class="nav" data-own>
  <div class="nav-in">
    <a href="#top" class="nav-name" id="nav-name"></a>
    <nav class="nav-links" aria-label="الأقسام">
      <a href="#about" data-t="about"></a>
      <a href="#work" data-t="work"></a>
      <a href="#stickers" data-t="stickers"></a>
      <a href="#services" data-t="services"></a>
    </nav>
    <a href="#contact" class="nav-cta" data-t="contact"></a>
  </div>
</header>

<main id="top" data-own>
  <section class="hero">
    <div class="aurora a3"></div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="hello" id="h-hello" hidden></p>
        <h1 class="headline" id="h-headline"></h1>
        <p class="intro" id="h-intro"></p>
        <div class="tools" id="tools" aria-label="الأدوات التي أستخدمها">
          <div class="tools-track" id="tools-track"></div>
        </div>
        <div class="hero-actions">
          <a href="#work" class="btn btn-light" data-t="seeWork"></a>
          <a href="#contact" class="btn btn-glass" data-t="talk"></a>
        </div>
      </div>
      <div class="hero-stage" id="stage">
        <div class="memoji-scene">
          <div class="ring"></div>
          <div class="memoji-wrap" id="memoji-wrap">
            <div class="memoji-tilt" id="memoji-tilt">
              <div class="memoji-main" id="memoji-main"></div>
            </div>
            <div class="memoji-shadow" id="memoji-shadow"></div>
          </div>
          <div class="chip chip-a" id="chip-role"></div>
          <div class="chip chip-b" id="chip-loc"></div>
        </div>
        <div class="chip chip-name" id="chip-name" hidden></div>
      </div>
    </div>
  </section>

  <section class="sec" id="about">
    <div class="wrap about-grid">
      <h2 data-t="aboutH"></h2>
      <div class="about-copy">
        <div class="bio about-bio-head" id="about-bio" hidden></div>
        <ul class="facts" id="about-facts"></ul>
        <div class="more-slot" id="more-slot">
          <button type="button" class="more-btn" id="bio-more-btn" hidden aria-expanded="false" aria-controls="bio-more"></button>
        </div>
        <div class="bio-more" id="bio-more" hidden>
          <div class="bio" id="about-bio-more"></div>
          <a class="btn btn-light about-wa" id="about-wa" hidden target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="showcase" id="showcase">
    <div class="aurora a4"></div>
    <div class="wrap show-head">
      <h2 data-t="featured"></h2>
      <p id="show-sub"></p>
    </div>
    <div class="scene" id="scene">
      <div class="phone-float">
        <div class="phone" id="phone">
          <div class="phone-edge"></div>
          <div class="phone-edge e2"></div>
          <span class="phone-btn" style="top:120px;height:34px"></span>
          <span class="phone-btn" style="top:170px;height:58px"></span>
          <div class="phone-body">
            <div class="screen">
              <div class="island"></div>
              <div class="status"><span>9:41</span><span>●●● ▮</span></div>
              <div class="screen-media" id="scr-media"></div>
              <div class="scr-ui">
                <div class="scr-title"><small id="scr-cat"></small><div id="scr-title"></div></div>
                <div class="mini"><span class="av" id="scr-av"></span><div class="grow"><div class="t" data-t="viewing"></div><div id="scr-name"></div></div><span class="wave" id="scr-wave"></span></div>
                <div class="mini"><div class="grow"><div class="t" data-t="client"></div><div id="scr-client"></div></div><span id="scr-year"></span></div>
              </div>
            </div>
          </div>
        </div>

    if(/محتوى|نص|كتابة|مقال|منشور|سوشال/.test(c)) return 'content';
    if(/حمل|إعلان|تسويق|استراتيج/.test(c)) return 'marketing';
    return 'identity';
  };
  S.projects.forEach(p=>{if(!p.group) p.group=inferGroup(p);});
  S.works.forEach(w=>{if(!w.group) w.group=inferGroup(w);});
  const anySpot=S.projects.some(p=>p.spotlight)||S.works.some(w=>w.spotlight);
  if(!anySpot){
    S.projects.forEach(p=>{if(p.featured) p.spotlight=true;});
    const seen=new Set();
    S.works.forEach(w=>{
      const g=w.group||'identity';
      if(!seen.has(g)){w.spotlight=true;seen.add(g);}
    });
    if(!S.projects.some(p=>p.spotlight)&&S.projects[0]) S.projects[0].spotlight=true;
  }
})();

let toolsMarqueeStop=null;
function toolsMarquee(){
  if(toolsMarqueeStop){toolsMarqueeStop(); toolsMarqueeStop=null;}
  const wrap=$('.tools'), track=$('#tools-track');
  if(!wrap||!track||reduce) return;
  let x=0, last=0, raf=0, hover=false, primed=false, prevW=0;
  const live=()=>!hover && !wrap.classList.contains('anim-off') && !document.hidden;
  const paint=()=>{track.style.transform=`translate3d(${x.toFixed(1)}px,0,0)`;};
  const measure=()=>{
    const row=track.firstElementChild;
    const w=row?row.offsetWidth:0;
    if(w<2) return 0;
    if(!primed){x=-w; primed=true;}
    else if(w!==prevW && prevW){
      x*=w/prevW;
      while(x>=0) x-=w;
      while(x<-w) x+=w;
    }
    prevW=w; paint();
    return w;
  };
  const step=now=>{
    if(!live()){raf=0; last=0; return;}
    raf=requestAnimationFrame(step);
    const w=measure();
    if(!w){last=now; return;}
    if(!last){last=now; return;}
    const dt=Math.min(48, now-last); last=now;
    x+=(w/42)*(dt/1000);
    if(x>=0) x-=w;
    paint();
  };
  const kick=()=>{if(!raf && live()){last=0; raf=requestAnimationFrame(step);}};
  const onEnter=()=>{hover=true; if(raf){cancelAnimationFrame(raf); raf=0;} last=0;};
  const onLeave=()=>{hover=false; kick();};
  const onVis=()=>document.hidden?(raf&&(cancelAnimationFrame(raf),raf=0,last=0)):kick();
  wrap.addEventListener('pointerenter',onEnter);
  wrap.addEventListener('pointerleave',onLeave);
  document.addEventListener('visibilitychange',onVis);
  const mo=new MutationObserver(kick);
  mo.observe(wrap,{attributes:true,attributeFilter:['class']});
  kick();
  toolsMarqueeStop=()=>{
    if(raf) cancelAnimationFrame(raf);
    raf=0;
    wrap.removeEventListener('pointerenter',onEnter);
    wrap.removeEventListener('pointerleave',onLeave);
    document.removeEventListener('visibilitychange',onVis);
    mo.disconnect();
  };
}

function formatParas(raw, lede){
  const MK={
    'مبدعة':'pill','توصل أفكارك':'wave','هويات':'outline','منشورات':'hi',
    'نتهاوش شوي':'wobble','أمووت':'hot','أموووووووت':'hot','جوكر':'grad','سلة':'tag',
    'البكسلز':'pixel','قوقل':'ggl','سيرش':'search','كي بي آيز':'kpi',
    'أتهاوش مع العملاء':'zag','يعصبوني':'mad','محتوى':'quote','أفتح شركة':'stamp',
    'حاسب':'code','أبرمج':'term','دق عليّ':'tap'
  };
  const fall=['pill','wave','outline','hi','wobble','hot','grad','tag','pixel'];
  let n=0;
  return String(raw||'').split(/\n{2,}/).filter(p=>p.trim()).map((p,i)=>{
    const plain=lede&&i===0;
    let inner=esc(p);
    inner=plain
      ? inner.replace(/\*\*(.+?)\*\*/g,'$1').replace(/توصل\s+أفكارك\.?/g,m=>`<span class="keep">${m}</span>`)
      : inner.replace(/\*\*(.+?)\*\*/g,(_,w)=>`<em class="mk mk-${MK[w]||fall[(n++)%fall.length]}">${w}</em>`);
    inner=inner.replace(/\n/g,'<br>');
    return `<p${plain?' class="lede"':''}>${inner}</p>`;
  }).join('');
}
function formatBio(raw){
  const s=String(raw||'');

    const [head, tail='']=s.split(/\n\+\+\+\n/);

  }

let typeGen=0, typeT=0;
function stopType(){
  typeGen++;

function playStoryType(){
  const host=$('#about-bio-more'), rest=$('#bio-more');
  if(!host) return;
  const full=host.dataset.full||host.innerHTML;
  host.dataset.full=full;
  if(reduce||!full){ setHTML(host,full); return; }
  const gen=++typeGen;
  const src=document.createElement('div');
  src.innerHTML=full;
  host.innerHTML='';
  rest.classList.add('typing');
  const wait=ms=>new Promise(r=>{typeT=setTimeout(r,ms);});
  const codeMark=async(el,g)=>{
    const word=el.textContent, glyphs='01<>/{}#;=_*';
    el.textContent=''; el.classList.add('mk-coding');
    for(let i=0;i<word.length;i++){
      if(g!==typeGen) return;
      for(let k=0;k<2;k++){
        if(g!==typeGen) return;
        el.textContent=word.slice(0,i)+glyphs[(i*3+k)%glyphs.length];
        await wait(55);
      }
      el.textContent=word.slice(0,i+1);
      await wait(95);
    }
    el.classList.remove('mk-coding');
  };
  (async()=>{
    for(const p of [...src.children]){
      if(gen!==typeGen) return;
      const out=document.createElement('p');
      if(p.className) out.className=p.className;
      host.appendChild(out);
      for(const n of [...p.childNodes]){
        if(gen!==typeGen) return;
        if(n.nodeType===3){
          const words=(n.textContent||'').match(/\S+\s*/g)||[];
          for(const w of words){
            if(gen!==typeGen) return;
            out.appendChild(document.createTextNode(w));
            await wait(150);
          }
        }else if(n.nodeName==='BR'){
          out.appendChild(document.createElement('br'));
        }else if(n.classList&&n.classList.contains('mk')){
          const mark=n.cloneNode(true);
          mark.classList.add('mk-pop');
          out.appendChild(mark);
          if(mark.classList.contains('mk-term')) await codeMark(mark,gen);
          else await wait(mark.classList.contains('mk-hot')?1250:mark.classList.contains('mk-mad')?1500:mark.classList.contains('mk-stamp')?1200:mark.classList.contains('mk-tag')?1000:780);
        }else{
          out.appendChild(n.cloneNode(true));
        }
      }
      if(gen===typeGen) refreshST();
    }
    if(gen===typeGen){ rest.classList.remove('typing'); refreshST(); }
  })();
}

const STK_FALLBACK=Array.from({length:41},(_,i)=>`stickers/sticker1-${String(i+1).padStart(2,'0')}.png`);
const STK_IMG=/\.(png|jpe?g|webp|gif|svg)$/i;
let STK=STK_FALLBACK.slice();
const stk={z:2,raf:0,ro:null,drag:null,bits:[],on:true,poll:0,load:0};
const stkRand=(a,b)=>a+Math.random()*(b-a);
function stkParseListing(html){
  const names=new Set();
  const re=/href\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s>]+))/gi;
  let m;
  while((m=re.exec(html))){
    let href=m[1]||m[2]||m[3]||'';
    href=href.split('?')[0].split('#')[0];
    if(!href||href.endsWith('/')) continue;
    let name='';
    try{name=decodeURIComponent(href.split('/').pop());}catch(e){name=href.split('/').pop();}
    if(name&&STK_IMG.test(name)&&!name.startsWith('.')&&!/^index\./i.test(name)) names.add(name);
  }
  return [...names].sort((a,b)=>a.localeCompare(b,'en',{numeric:true,sensitivity:'base'})).map(n=>'stickers/'+n);
}
function stkSame(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i]);}
async function stkDiscover(){
  try{
    const r=await fetch('stickers/',{cache:'no-store'});
    if(r.ok){
      const ct=r.headers.get('content-type')||'';
      const text=await r.text();
      if(/html/i.test(ct)||/<a\s/i.test(text)){
        const list=stkParseListing(text);
        if(list.length) return list;
      }
    }
  }catch(e){}
  try{
    const r=await fetch('stickers.json',{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      const raw=Array.isArray(j)?j:(j&&j.files)||[];
      const list=raw.map(x=>String(x)).filter(Boolean).map(x=>x.startsWith('stickers/')?x:'stickers/'+x.replace(/^\.?\//,''));
      if(list.length) return list;
    }
  }catch(e){}
  return STK_FALLBACK.slice();
}
async function stkRefresh(force){
  const id=++stk.load;
  const list=await stkDiscover();
  if(id!==stk.load) return;
  if(!force&&stkSame(list,STK)&&stk.bits.length===list.length) return;
  STK=list;
  paintStickers();
}
const stkRand=(a,b)=>a+Math.random()*(b-a);
function stkTeardown(){
  if(stk.raf){cancelAnimationFrame(stk.raf);stk.raf=0;}
  if(stk.ro){stk.ro.disconnect();stk.ro=null;}
  if(stk.drag){stk.drag=null; lenis&&!dashOpen&&!modalOpen()&&lenis.start();}
  stk.bits=[];
}
function stkMotion(el,hx,hy,size){
  el._m={
    hx,hy,s:size,
    r:stkRand(-10,10),
    p:stkRand(0,Math.PI*2),
    sx:stkRand(.28,.48),
    sy:stkRand(.22,.4),
    sr:stkRand(.18,.32),
    ax:stkRand(18,32),
    ay:stkRand(14,26),
    rr:stkRand(3.5,6.5)
  };
  el.style.setProperty('--s',size+'px');
  el.style.setProperty('--r',el._m.r.toFixed(1)+'deg');
  el.style.left=hx+'px';
  el.style.top=hy+'px';
}
function stkLayout(grid){
  const w=grid.clientWidth, h=grid.clientHeight, n=STK.length;
  const mobile=matchMedia('(max-width:900px)').matches;
  const cols=mobile?5:7;
  const rows=Math.ceil(n/cols);
  const padX=mobile?18:28, padY=mobile?44:52;
  const cw=(w-padX*2)/cols, ch=(h-padY-16)/rows;
  const sizeMin=mobile?74:88, sizeMax=mobile?90:108;
  STK.forEach((src,i)=>{
    const el=stk.bits[i]; if(!el) return;
    const col=i%cols, row=Math.floor(i/cols);
    const size=stkRand(sizeMin,sizeMax);
    const hx=padX+col*cw+(cw-size)/2+stkRand(-10,10);
    const hy=padY+row*ch+(ch-size)/2+stkRand(-8,8);
    el.querySelector('.stk-face').style.animationDelay=(-stkRand(0,9)).toFixed(2)+'s';
    stkMotion(el,hx,hy,size);
  });
}
function stkBind(el,grid){
  let sx=0,sy=0,ox=0,oy=0,moved=false;
  el.addEventListener('pointerdown',e=>{
    if(e.button) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    stk.drag=el; moved=false;
    sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    el.classList.add('hold');
    el.style.zIndex=String(++stk.z);
    lenis&&lenis.stop();
  });
  el.addEventListener('pointermove',e=>{
    if(stk.drag!==el) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.hypot(dx,dy)>5) moved=true;
    el.style.left=(ox+dx)+'px';
    el.style.top=(oy+dy)+'px';
  });
  const end=()=>{
    if(stk.drag!==el) return;
    el.classList.remove('hold');
    stk.drag=null;
    lenis&&!dashOpen&&!modalOpen()&&lenis.start();
    if(moved) el.dataset.moved='1';
    const s=el._m?.s||80;
    const x=Math.min(grid.clientWidth-s*.4, Math.max(-s*.15, parseFloat(el.style.left)||0));
    const y=Math.min(grid.clientHeight-s*.4, Math.max(10, parseFloat(el.style.top)||0));
    el.style.left=x+'px'; el.style.top=y+'px';
    if(el._m){el._m.hx=x; el._m.hy=y;}
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}
function stkTick(now){
  stk.raf=requestAnimationFrame(stkTick);
  const sec=$('#stickers');
  if(document.hidden||(sec&&sec.classList.contains('anim-off'))) return;
  const t=now/1000;
  stk.bits.forEach(el=>{
    if(el===stk.drag||!el._m) return;
    const a=el._m;
    el.style.left=(a.hx+Math.sin(t*a.sx+a.p)*a.ax)+'px';
    el.style.top=(a.hy+Math.cos(t*a.sy+a.p)*a.ay)+'px';
    el.style.setProperty('--r',(a.r+Math.sin(t*a.sr+a.p)*a.rr).toFixed(1)+'deg');
  });
}
function paintStickers(){
  stkTeardown();
  const grid=$('#stk-grid');
  if(!grid) return;
  grid.innerHTML='';
  STK.forEach(src=>{
    const el=document.createElement('button');
    el.type='button';
    el.className='stk-bit';
    el.dataset.stk=src;
    el.innerHTML=`<span class="stk-face"><img src="${esc(src)}" alt="" decoding="async" draggable="false"></span>`;
    grid.appendChild(el);
    stkBind(el,grid);
    stk.bits.push(el);
  });
  const place=()=>{ if(grid.clientWidth>40) stkLayout(grid); };
  requestAnimationFrame(()=>requestAnimationFrame(place));
  if(!reduce) stk.raf=requestAnimationFrame(stkTick);
  if(window.ResizeObserver){
    stk.gw=0; stk.gh=0;
    stk.ro=new ResizeObserver(()=>{
      const w=grid.clientWidth, h=grid.clientHeight;
      if(Math.abs(w-(stk.gw||0))<8&&Math.abs(h-(stk.gh||0))<8) return;
      stk.gw=w; stk.gh=h;
      if(stk.drag) return;
      stkLayout(grid);
    });
    stk.ro.observe(grid);
  }
}
function renderStickers(){
  stkRefresh(true);
  if(!stk.poll){

/* يوقف الحركات اللانهائية للأقسام الخارجة عن الشاشة */
function pauseOffscreen(sel){
  if(!('IntersectionObserver' in window)) return;
  const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('anim-off',!e.isIntersecting)),{rootMargin:'200px'});
  $$(sel).forEach(el=>io.observe(el));
}

function memojiLoop(){
  const tilt=$('#memoji-tilt'), shadow=$('#memoji-shadow'), stage=$('#stage');
  if(!tilt||reduce) return;
  let tx=0,ty=0,cx=0,cy=0,raf=0,onScreen=true,t0=0,lastPtr=0;
  let touch=!matchMedia('(hover:hover)').matches;
  addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5;lastPtr=performance.now();touch=false;},{passive:true});
  const frame=now=>{
    raf=requestAnimationFrame(frame);
    if(!t0) t0=now;
    const intro=Math.min(1,(now-t0)/1600);
    const idle=touch||now-lastPtr>3500, s=(now-t0)/1000;
    if(idle){tx=Math.sin(s*.7)*.28;ty=Math.sin(s*.9)*.14;}
    cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
    const fy=Math.sin(s*1.3)*10*intro;
    tilt.style.transform=`translate3d(0,${fy.toFixed(2)}px,0) rotateY(${(cx*34*intro).toFixed(2)}deg) rotateX(${(-cy*22*intro).toFixed(2)}deg)`;
    shadow.style.transform=`translate3d(${(cx*30*intro).toFixed(2)}px,0,0)`;
    shadow.style.opacity=(.55+.2*intro).toFixed(3);
  };
  const start=()=>{if(!raf&&onScreen&&!document.hidden) raf=requestAnimationFrame(frame);};
  const stop=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}};
  if('IntersectionObserver' in window&&stage){
    new IntersectionObserver(es=>{onScreen=es[0].isIntersecting; onScreen?start():stop();},{rootMargin:'160px'}).observe(stage);
  }
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  start();
}
function motion(){
  const G=window.gsap, ST=window.ScrollTrigger;
  if(window.Lenis&&!reduce){
    lenis=new window.Lenis({lerp:.085,smoothWheel:true});
    if(G&&ST){lenis.on('scroll',ST.update);G.ticker.add(tm=>lenis.raf(tm*1000));G.ticker.lagSmoothing(0);}
    else{const r=tm=>{lenis.raf(tm);requestAnimationFrame(r)};requestAnimationFrame(r);}
  }
  memojiLoop();
  pauseOffscreen('.hero-stage,.scene,.tools,.stk-sec');
  const onChase=()=>chaseMore();
  if(lenis) lenis.on('scroll',onChase);
  addEventListener('scroll',onChase,{passive:true});
  addEventListener('resize',onChase,{passive:true});
  chaseMore();
  if(G&&ST&&!reduce){
    G.registerPlugin(ST);
    const tl=G.timeline({defaults:{ease:'power3.out',duration:1.2}});
    tl.from('.nav-in',{y:-40,opacity:0,duration:1})
      .from('#h-headline .line>span',{yPercent:115,stagger:.1,duration:1.35},.12)
      .from(['#h-intro','.hero-actions'],{y:24,opacity:0,stagger:.1,duration:1},.4)
      .from('#memoji-wrap',{opacity:0,duration:1.05,force3D:false},.2)
      .from('.ring',{opacity:0,duration:1.1},.35);
    G.fromTo(['.chip-a','.chip-b','#chip-name'],{rotateY:0},{rotateY:-90,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:1.2}});
    G.fromTo('#phone',{rotateX:30,rotateY:-38,rotateZ:-16,y:90},{rotateX:10,rotateY:-14,rotateZ:-6,y:-30,ease:'none',scrollTrigger:{trigger:'#showcase',start:'top bottom',end:'bottom top',scrub:1.2}});
    [['.fc-1',-140],['.fc-2',-60],['.fc-3',-200]].forEach(([s,y])=>G.fromTo(s,{y:y*-.5},{y,ease:'none',scrollTrigger:{trigger:'#showcase',start:'top bottom',end:'bottom top',scrub:1.4}}));
    G.from('#showcase .fc-in',{opacity:0,scale:.8,stagger:.15,duration:1.2,ease:'expo.out',scrollTrigger:{trigger:'#scene',start:'top 75%'}});
    /* الصور المتأخرة تغيّر طول الصفحة، فلازم نعيد قياس نقاط التمرير */
    addEventListener('load',()=>ST.refresh(),{once:true});
  }
  const fin=$('#contact');
  if(reduce){fin.classList.add('write');}
  else new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){fin.classList.add('write');o.disconnect();}}),{threshold:.35}).observe(fin);
}

    <p class="hint" style="margin-top:20px">الحجم الحالي تقريباً: ${(estSize()/1048576).toFixed(1)} ميجا من 16.</p>
    ${ART?'':'<p class="hint">أنت تشتغل على نسخة محلية: زر "تنزيل نسخة محدّثة" يحفظ ملف HTML جديد فيه تعديلاتك، استبدل به الملف الحالي.</p>'}`;
  }
  B.innerHTML=h;
}

const dashBody=$('#dash-body');
dashBody.addEventListener('input',e=>{
  const el=e.target, p=el.dataset.path; if(!p) return;
  let v=el.type==='checkbox'?el.checked:el.value;

dashBody.addEventListener('toggle',e=>{const d=e.target; if(d.matches?.('details[data-id]')) d.open?openItems.add(d.dataset.id):openItems.delete(d.dataset.id);},true);

let pending=null; const fileIn=$('#file-in');
dashBody.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const a=b.dataset.act, p=b.dataset.path;
  if(a==='upload'){pending={p,mode:b.dataset.mode};fileIn.accept=b.dataset.accept;fileIn.multiple=b.hasAttribute('data-multi');fileIn.value='';fileIn.click();return;}
  if(a==='add-project'){const id=uid();S.projects.push({id,title:'مشروع جديد',client:'',year:String(new Date().getFullYear()),category:'',group:'identity',description:'',cover:'',images:[],hue:Math.floor(Math.random()*360),featured:!S.projects.length});openItems.add(id);}
  if(a==='add-service') S.services.push({id:uid(),title:'خدمة جديدة',desc:'',icon:'spark'});
  if(a==='add-contact') S.contacts.push({id:uid(),type:'website',label:'موقعي',url:''});
  if(a==='del'||a==='up'||a==='down'){
    const ks=p.split('.'),i=+ks.pop(),arr=getP(ks.join('.'));
    if(a==='del'){if(!confirm('متأكد تبي تحذفه؟'))return; arr.splice(i,1); if(ks[0]==='projects'&&arr.length&&!arr.some(x=>x.featured))arr[0].featured=true;}
    else{const j=a==='up'?i-1:i+1; if(j<0||j>=arr.length)return; [arr[i],arr[j]]=[arr[j],arr[i]];}
  }
  if(a==='rmimg'){
    const ks=p.split('.'),last=ks.pop(),parent=getP(ks.join('.'));
    if(Array.isArray(parent)) parent.splice(+last,1); else parent[last]='';
  }
  markDirty(); renderDash(); render();
});

fileIn.addEventListener('change',async()=>{
  const files=[...fileIn.files]; if(!files.length||!pending) return;
  const {p,mode}=pending; toast('جاري تجهيز الصور…');
  try{
    for(const f of files){
      if(mode==='memoji'){
        const r=await prep(f,900,true); S.site.memoji=r.url; S.site.memojiType=r.type;
      }else if(mode==='new-works'){
        const r=await prep(f,1600); S.works.push({id:uid(),title:f.name.replace(/\.[^.]+$/,''),category:'',group:'identity',image:r.url,hue:260});
      }else if(mode==='push'){
        const r=await prep(f,1800); const arr=getP(p); if(Array.isArray(arr)) arr.push(r.url);
      }else{
        const r=await prep(f,1600); setP(p,r.url);
      }
    }
    markDirty(); renderDash(); render(); toast('تمت الإضافة');
  }catch(err){toast(err.message==='video'?'الفيديو أكبر من 6 ميجا، جرّب مقطع أقصر':'ما قدرت أقرأ الملف، جرّب صورة PNG أو JPG');}
});
function readURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
/* createImageBitmap غير مدعوم في سفاري القديم، فنرجع لـ <img> */
async function decodeImage(file){
  if(window.createImageBitmap){
    try{const b=await createImageBitmap(file); return {src:b,free:()=>b.close&&b.close()};}catch(e){}
  }
  const obj=URL.createObjectURL(file);
  const img=new Image();
  img.src=obj;
  await (img.decode?img.decode():new Promise((res,rej)=>{img.onload=res;img.onerror=rej;}));
  return {src:img,free:()=>URL.revokeObjectURL(obj)};
}
async function prep(file,max,alpha){
  if(file.type.startsWith('video/')){ if(file.size>6e6) throw new Error('video'); return {url:await readURL(file),type:'video'}; }
  const {src,free}=await decodeImage(file);
  try{
    const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
    if(!w||!h) throw new Error('image');
    const k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
    const ctx=c.getContext('2d'); if(!ctx) throw new Error('image');
    ctx.drawImage(src,0,0,c.width,c.height);
    let out=c.toDataURL('image/webp',.84);
    if(!out.startsWith('data:image/webp')) out=alpha||file.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.84);
    return {url:out,type:'image'};
  } finally { free(); }
}

function buildHTML(){
  const c=PRISTINE.cloneNode(true);
  ['head','body'].forEach(tag=>{const part=c.querySelector(tag); if(part)[...part.children].forEach(el=>{if(!el.hasAttribute('data-own'))el.remove();});});
  c.setAttribute('dir',S.site.dir==='ltr'?'ltr':'rtl'); c.setAttribute('lang',S.site.dir==='ltr'?'en':'ar');
  c.querySelector('title').textContent=`${S.site.name} | ${S.site.role}`;
  const d=c.querySelector('#meta-desc'); if(d&&S.site.intro) d.setAttribute('content',S.site.intro);
  c.querySelector('#pf-data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}

$('#publish-btn').addEventListener('click',async()=>{
  const html=buildHTML();
  const btn=$('#publish-btn'), label=ART?'نشر التعديلات':'تنزيل نسخة محدّثة';
  if(html.length>15.5*1048576&&ART){toast('الصفحة كبيرة، احذف بعض الصور أو الفيديو');return;}
  /* نسخة محلية: ننزّل ملف HTML جديد فيه البيانات المحدّثة */
  if(!ART){
    try{
      const blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
      const a=document.createElement('a');
      a.href=blobUrl; a.download=`${(S.site.name||'portfolio').trim()||'portfolio'}.html`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(blobUrl),8000);
      markClean(); toast('تم تنزيل نسخة محدّثة، استبدل بها الملف الحالي');
    }catch(e){toast('ما قدرت أنزّل الملف');}
    return;
  }
  btn.disabled=true; btn.textContent='جاري النشر…';
  try{ await ART.publish(html); markClean(); toast('انتشرت التعديلات'); }
  catch(err){
    const c=err&&err.code;
    if(c==='conflict') toast('الصفحة تغيّرت من مكان ثاني، حدّث الصفحة وأعد المحاولة');
    else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled') toast('هذي النسخة للعرض فقط');
    else if(c==='too_large') toast('الصفحة كبيرة، احذف بعض الصور');
    else if(c==='rate_limited') toast('انتظر دقيقة وجرّب مرة ثانية');
    else toast('ما تم النشر، جرّب مرة ثانية');
  }finally{btn.disabled=false;btn.textContent=label;}
});

function openDash(){dashOpen=true;hideGate();$('#dash').classList.add('open');lenis&&lenis.stop();renderDash();chaseMore();}
function closeDash(){if(dirty&&!confirm('عندك تعديلات ما انتشرت. تبي تقفل؟ (تبقى ظاهرة لين تحدّث الصفحة)'))return;dashOpen=false;$('#dash').classList.remove('open');lenis&&!modalOpen()&&lenis.start();chaseMore();}

$$('.dash-nav [data-dt]').forEach(b=>b.addEventListener('click',()=>{dtab=b.dataset.dt;renderDash();}));
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* الدخول للوحة: رابط سري + كلمة سر فقط */
const VAULT='#/lk/7f3a9c2e8b14/atelier';
const PW='lama'+'0'.repeat(4);
const GATE_OK='pf.studio';
const isVault=()=>decodeURIComponent(location.hash||'')===VAULT;
const unlocked=()=>{try{return sessionStorage.getItem(GATE_OK)==='1';}catch(e){return false;}};
const remember=()=>{try{sessionStorage.setItem(GATE_OK,'1');}catch(e){}};
function hideGate(){const g=$('#gate'); if(g) g.classList.remove('open'); lenis&&!dashOpen&&!modalOpen()&&lenis.start();}
function showGate(){
  const g=$('#gate'), inp=$('#gate-pass');
  if(!g) return;
  g.classList.add('open');
  lenis&&lenis.stop();
  inp&&(inp.value='', setTimeout(()=>inp.focus(),80));
}
function checkVault(){
  if(!isVault()){hideGate(); return;}
  if(unlocked()){openDash(); return;}
  showGate();
}
$('#gate-form')?.addEventListener('submit',e=>{
  e.preventDefault();
  const inp=$('#gate-pass'), card=$('#gate-form');
  const ok=(inp?.value||'')===PW;
  if(ok){remember(); openDash(); history.replaceState(null,'',VAULT);}
  else{
    card.classList.remove('bad'); void card.offsetWidth; card.classList.add('bad');
    toast('كلمة السر غلط');
    inp&&(inp.value='', inp.focus());
  }
});
addEventListener('hashchange',checkVault);

const STANDALONE=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
async function gate(){
  if(window.claude&&window.claude.use){
    try{
      const [u,a]=await Promise.all([claude.use('user'),claude.use('artifact')]);
      ART=a;
      if(ART){
        if(STANDALONE) $('#publish-btn').textContent='تنزيل نسخة محدّثة';
        checkVault();
        return;
      }
    }catch(e){}
  }
  if(STANDALONE) $('#publish-btn').textContent='تنزيل نسخة محدّثة';
  checkVault();
}

render();
if(document.readyState==='loading') addEventListener('DOMContentLoaded',motion,{once:true});
else motion();
gate();
})();
